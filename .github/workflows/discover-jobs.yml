name: Safe job discovery
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# Share the deployment lock so a push build cannot overwrite a newer scan.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch permitted public feeds
        env:
          JOB_API_KEY: ${{ secrets.JOB_API_KEY }}
        # Handled outages still publish retained jobs and health. Fatal errors stop here.
        run: npm run discover -- --report-only
      - run: npm test
      - run: npm run check:secrets
      - name: Commit data and scan health
        run: |
          git add src/data/jobs.json src/data/scan-status.json public/data/jobs.json public/data/scan-status.json
          if git diff --cached --quiet; then
            echo "No data or scan health changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: refresh permitted job feeds and scan health"
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy updated jobs and scan health
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published dataset
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-deployment.js
      - name: Report degraded scan after publishing health
        if: ${{ !cancelled() }}
        run: node --input-type=module -e "import fs from 'node:fs'; const scan = JSON.parse(fs.readFileSync('src/data/scan-status.json')); if (scan.status !== 'Active') { console.error(scan.status); process.exit(1) }"
