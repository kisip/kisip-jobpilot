name: Safe job discovery
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch permitted public feeds
        env:
          JOB_API_KEY: ${{ secrets.JOB_API_KEY }}
        run: npm run discover
      - run: npm test
      - run: npm run check:secrets
      - name: Commit data changes only
        run: |
          if git diff --quiet -- src/data/jobs.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/jobs.json
          git commit -m "data: refresh permitted job feeds"
          git push
